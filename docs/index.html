  <script id="growme-copy-delegate">
(function () {
  if (window.__growmeCopyInit) return;
  window.__growmeCopyInit = true;

  function copySync(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function showToast(anchor, message) {
    document.querySelectorAll('.copy-float-toast').forEach(function (n) { n.remove(); });
    var tip = document.createElement('div');
    tip.className = 'copy-float-toast show';
    tip.setAttribute('role', 'status');
    tip.textContent = message;
    document.body.appendChild(tip);
    var rect = anchor.getBoundingClientRect();
    var tipRect = tip.getBoundingClientRect();
    var margin = 8;
    var left = rect.left + rect.width / 2 - tipRect.width / 2;
    var top = rect.bottom + 6;
    left = Math.max(margin, Math.min(left, window.innerWidth - tipRect.width - margin));
    if (top + tipRect.height > window.innerHeight - margin) {
      top = Math.max(margin, rect.top - tipRect.height - 6);
    }
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () { tip.remove(); }, 1800);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-copy], .mat-copy, .cell-material-name');
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    var text = (el.getAttribute('data-copy') || el.textContent || '').trim();
    if (!text) return;
    if (copySync(text)) {
      showToast(el, '已复制到剪贴板');
      el.classList.add('copied');
      setTimeout(function () { el.classList.remove('copied'); }, 800);
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(el, '已复制到剪贴板');
        el.classList.add('copied');
        setTimeout(function () { el.classList.remove('copied'); }, 800);
      }).catch(function () {
        showToast(el, '复制失败，请手动选择复制');
      });
      return;
    }
    showToast(el, '复制失败，请手动选择复制');
  }, true);
})();
  </script>
