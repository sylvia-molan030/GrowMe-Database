<!DOCTYPE html>
<html lang="zh-CN" data-build="20">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowMe · 买量素材复盘 BI</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">GrowMe</div>
        <div class="brand-sub">买量素材复盘 BI</div>
      </div>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="菜单">☰</button>
      <nav class="nav">
        <button class="nav-item active" data-page="golden-cross">素材黄金交叉复盘</button>
        <button class="nav-item" data-page="leaderboard">智能排行榜</button>
        <button class="nav-item" data-page="designer">设计师绩效看板</button>
        <button class="nav-item" data-page="asset-library">核心资产晋级库</button>
        <button class="nav-item" data-page="weekly-update">周维度更新</button>
        <button class="nav-item" data-page="rollback">回滚素材</button>
        <button class="nav-item" data-page="review-board">每日决策面板</button>
      </nav>
      <div class="sidebar-meta" id="sidebar-meta"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">素材黄金交叉复盘</h1>
          <span id="data-freshness" style="font-size:11px;color:#6b7280;margin-left:12px;padding:2px 8px;background:#f3f4f6;border-radius:4px"></span>
        </div>
        <div class="topbar-actions">
          <input type="file" id="file-upload" class="upload-input" accept=".csv,.xlsx,.xls" multiple hidden />
          <button class="btn btn-primary" id="btn-upload" type="button">↑ 上传数据</button>
        </div>
      </header>

      <section class="filters" id="filters"></section>
      <section class="page-content" id="page-content"></section>
    </main>
  </div>

  <script type="module" src="./assets/js/app.js?v=20"></script>
</body>
</html>
